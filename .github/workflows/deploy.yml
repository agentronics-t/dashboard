name: Deploy

# Tag-driven deploys via Workload Identity Federation (no long-lived SA keys).
# One-time setup on a (new) GCP project: infra/bring-up.sh, then
# infra/setup-wif.sh, then add repo Variables:
#   GCP_PROJECT, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, GCP_REGION (default us-east1)
# Tag a release to deploy:  git tag v0.3.0 && git push origin v0.3.0
#
# Only intel-api ships. The retired intelligence services (intel-worker,
# intel-ml) are no longer built or deployed — see infra/README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for WIF

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION || 'us-east1' }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # Apply pending Drizzle migrations to the serving Neon BEFORE rolling out
      # new code, so a new revision never lands on an un-migrated schema. The
      # deploy SA gets secretAccessor on `neon-database-url` only (setup-wif.sh).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate serving schema (Neon)
        run: |
          set -euo pipefail
          DB=$(gcloud secrets versions access latest --secret=neon-database-url --project "$PROJECT")
          echo "::add-mask::${DB}"
          umask 077
          printf 'DATABASE_URL=%s\n' "${DB}" > packages/intel-schema/.env
          pnpm --filter @agentronics/intel-schema db:migrate
          rm -f packages/intel-schema/.env

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build, push, deploy intel-api
        run: |
          set -euo pipefail
          img="${REGION}-docker.pkg.dev/${PROJECT}/intel/intel-api:$(date +%Y%m%d-%H%M%S)"
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            -f apps/intel-api/Dockerfile -t "$img" .
          docker push "$img"
          gcloud run services update intel-api --image "$img" --region "$REGION" --project "$PROJECT" --quiet
      - name: Smoke check API health
        run: |
          url=$(gcloud run services describe intel-api --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          curl -fsS "$url/health" && echo " — api healthy"
